name: Application CI

# Cloud verification is intentionally opt-in while the repository is on a
# constrained Actions allowance. Local verification lives in scripts/ci-local.sh.
# Version tags are the explicit release gate; do not trigger on every PR/push.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, safety and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install native engine crypto headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install locked dependencies
        run: npm ci

      - name: Native C++ engine tests
        run: npm run engine:test

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production safety contracts
        run: npm run check:safety

      - name: Build Next.js application
        run: npm run build
