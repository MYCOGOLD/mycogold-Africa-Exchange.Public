name: Single Exchange Emitter
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Push single price to all devices
        run: |
          python3 << 'PY'
          import time, hashlib
          from supabase import create_client
          URL = "https://vuwqmuficrrcseoovsnn.supabase.co"
          KEY = "sb_publishable_rJh2PaoJ93y9Qghu7a9H9g_nxX9tjOw"
          supa = create_client(URL, KEY)
          def cprng(loc, tick):
              raw = hashlib.sha256(f"{loc}{tick}MYCOGOLD_2026_SINGLE".encode()).hexdigest()
              return int(raw[:8],16)/0xFFFFFFFF*2-1, raw[:12]
          end = time.time()+50
          while time.time() < end:
              tick = int(time.time())
              c,p = cprng("MFPI", tick)
              mfpi = 109.92 + c*0.8
              hubs = []
              for name, vol in [("Kericho",0.9),("Molo",0.6),("Wakulima Market",1.2),("Nakuru Town",0.8),("Eldoret",0.5),("Kisumu",0.7)]:
                  cv,_ = cprng(name, tick)
                  mush = max(150, min(600, 252.5+2.8*vol*cv))
                  hubs.append({"name":name, "mush":round(mush,2)})
              supa.table("live_prices").upsert({"id":1,"tick":tick,"mfpi":mfpi,"hubs":hubs,"proof":p}).execute()
              print(f"Pushed tick {tick} MFPI {mfpi}")
              time.sleep(1)
          PY
          "
