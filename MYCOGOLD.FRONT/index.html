<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=1100"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>MycoGold V2.3 NO BARS FIX</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0A1F2F;color:#d9ece1;font-family:Inter;min-width:1100px}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}.flick-slow{animation:fs 1.2s ease}@keyframes fs{50%{transform:scale(1.2);color:#FFD60A;text-shadow:0 0 12px #FFD60A}}.mfpi-flick{animation:mf 0.9s ease}@keyframes mf{50%{transform:scale(1.1);color:#FFD60A}}</style></head><body>
<div class="px-4 py-1 text-[11px] bg-black/40 flex gap-3"><span id="mfpi" class="font-black">MFPI 107.18</span><span>131 Live</span><div id="avgTop" class="flex gap-3 ml-4"></div><span class="ml-auto bg-green-500/20 px-2 rounded-full text-[9px]">● LIVE FLICKER</span></div>
<div class="mx-3 mt-2 rounded-xl bg-[#0F2F4F] border border-yellow-500/20 h-[34px] flex items-center"><marquee id="ticker" class="text-[11px]"></marquee></div>
<div class="flex"><div class="w-[180px] p-3"><div class="font-black text-[#FFD60A]">MYCOGOLD</div><div class="text-[8px] opacity-50">NATURE'S WEALTH YOUR HEALTH</div><div class="mt-4 space-y-1 text-[12px]"><button class="w-full text-left px-4 py-2 rounded-full bg-white/10">Market</button><button class="w-full text-left px-4 py-2 rounded-full">TUSK Insights</button><button class="w-full text-left px-4 py-2 rounded-full">Weather</button><button class="w-full text-left px-4 py-2 rounded-full border border-yellow-500/20">🔄 Exchange</button><button class="w-full mt-4 px-4 py-2 rounded-full bg-[#FFD60A] text-black font-bold">+ Post Produce</button></div></div>
<div class="flex-1 p-3"><div class="flex gap-2 mb-3 text-[11px]"><span class="px-3 py-1 rounded-full bg-[#FFD60A] text-black">All</span><span class="px-3 py-1 rounded-full glass">🍄 Mushroom</span><span class="px-3 py-1 rounded-full glass">🥔 Potatoes</span><span class="px-3 py-1 rounded-full glass">🧅 Onions</span><span class="px-3 py-1 rounded-full glass">🥬 Kales</span><span class="px-3 py-1 rounded-full glass">🥬 Cabbage</span><span class="px-3 py-1 rounded-full glass">🌾 Cereals</span><span class="px-3 py-1 rounded-full glass">🥩 Beef</span></div>
<!-- AI DOTS ONLY - NO BARS -->
<div class="relative glass rounded-2xl overflow-hidden bg-[#081A2B] border border-white/10" style="height:230px"><canvas id="aiCanvas" style="width:100%;height:100%;display:block"></canvas><div class="absolute top-2 left-3 text-[9px] opacity-60">AI NEURAL • YELLOW BLUE GREEN • BOMBARDMENT • NO BARS</div></div>
<div id="avgBoxes" class="grid grid-cols-4 gap-2 mt-3"></div>
<div class="grid grid-cols-2 gap-3 mt-3"><div><h3 class="text-[10px] opacity-70 mb-2">ALL SELLERS - 100 LISTINGS</h3><div id="sellers" class="space-y-1 max-h-[600px] overflow-y-auto"></div></div><div><h3 class="text-[10px] opacity-70 mb-2">ALL BUYERS - 100 LISTINGS</h3><div id="buyers" class="space-y-1 max-h-[600px] overflow-y-auto"></div></div></div>
</div></div>
<script>
const cats=["Mushroom","Potatoes","Onions","Kales","Cabbage","Cereals","Beef","Tomatoes"]; const locs=["Kericho","Nakuru","Nairobi","Kisumu"]; const markets={"Kericho":"Kericho Main","Nakuru":"Wakulima Nakuru","Nairobi":"Wakulima Nairobi","Kisumu":"Kibuye Kisumu"}; function R(a){return a[Math.floor(Math.random()*a.length)]}; let items=[]; for(let i=0;i<100;i++){let c=R(cats),l=R(locs); items.push({c,prod:`${c} ${10+Math.floor(Math.random()*40)}kg`,loc:l,market:markets[l],price:30+Math.floor(Math.random()*90),seller:R(["Samuel K","Myco Farm","Chebet"]),buyer:R(["Export needs Mushroom Powder 100kg","Hotel","Supermarket"])})}
let avg={}; cats.forEach(c=>{let f=items.filter(x=>x.c===c); avg[c]=Math.round(f.reduce((s,x)=>s+x.price,0)/Math.max(f.length,1))}); let prev={...avg};
let mfpi=107.18; function updMFPI(){let ch=(Math.random()-0.5)*2; mfpi+=ch; let el=document.getElementById('mfpi'); el.innerHTML=`MFPI ${mfpi.toFixed(2)} <span class="${ch>=0?'text-green-400':'text-red-400'}">${ch>=0?'▲':'▼'}${Math.abs(ch).toFixed(2)}%</span>`; el.classList.remove('mfpi-flick'); void el.offsetWidth; el.classList.add('mfpi-flick');} setInterval(updMFPI,1500);
function render(){let h=""; cats.slice(0,4).forEach(c=>{let changed=prev[c]!==avg[c]; h+=`<div class="glass rounded-xl p-2"><div class="text-[8px] opacity-50">AVG TUSK • ${c}</div><b class="text-[12px] text-[#FFD60A] ${changed?'flick-slow':''}">${avg[c]} KES</b></div>`}); document.getElementById('avgBoxes').innerHTML=h; document.getElementById('avgTop').innerHTML=cats.slice(0,4).map(c=>`${c} <b class="text-[#FFD60A] ${prev[c]!==avg[c]?'flick-slow':''}">${avg[c]} KES</b>`).join(' '); let s="",b=""; items.forEach(it=>{s+=`<div class="glass rounded-xl p-2 flex justify-between"><div><div class="text-[9px] opacity-50">${it.seller} ${it.loc}</div><b class="text-[11px]">${it.prod} @ ${it.price} KES</b></div><span class="text-[10px]">${it.market}</span></div>`; b+=`<div class="glass rounded-xl p-2 flex justify-between"><div><div class="text-[9px] opacity-50">${it.buyer}</div><b class="text-[11px]">${it.prod} @ ${it.price+10} KES</b></div><span class="text-[9px]">${it.market}</span></div>`}); document.getElementById('sellers').innerHTML=s; document.getElementById('buyers').innerHTML=b; document.getElementById('ticker').innerText=items.slice(0,10).map(i=>`SELLER: ${i.seller} ${i.prod} @${i.price} KES • ${i.market} • BUYER: ${i.buyer}`).join(' • ')} render();
setInterval(()=>{prev={...avg}; cats.forEach(c=>{let vol=avg[c]*0.02; avg[c]=Math.max(10,Math.round(avg[c]+(Math.random()-0.5)*2*vol))}); render()},2700);
// DOTS Y/B/G BOMBARDMENT - NO BARS
const canvas=document.getElementById('aiCanvas'); const ctx=canvas.getContext('2d'); function resize(){canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight} resize(); window.addEventListener('resize',resize);
let dots=[]; const cols=['#FFD60A','#00B0FF','#00E676']; for(let i=0;i<30;i++){dots.push({x:Math.random()*canvas.width,y:Math.random()*230,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,r:2+Math.random()*3,col:cols[i%3]})}
function draw(){let w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h); dots.forEach((a,i)=>{dots.slice(i+1).forEach(b=>{let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy); if(d<15){let tx=a.vx,ty=a.vy; a.vx=b.vx*1.2; a.vy=b.vy*1.2; b.vx=tx*1.2; b.vy=ty*1.2; ctx.fillStyle='rgba(255,214,10,0.3)'; ctx.beginPath(); ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,12,0,6.28); ctx.fill()} if(d<130){ctx.strokeStyle=a.col+'33'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke()}})}); dots.forEach(d=>{d.x+=d.vx; d.y+=d.vy; if(d.x<0||d.x>w) d.vx*=-1; if(d.y<0||d.y>h) d.vy*=-1; ctx.fillStyle=d.col; ctx.shadowColor=d.col; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.28); ctx.fill(); ctx.shadowBlur=0}); requestAnimationFrame(draw)} draw();
</script></body></html>
